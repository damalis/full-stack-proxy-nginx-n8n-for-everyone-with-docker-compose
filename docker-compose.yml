services:

    n8n:
#        depends_on:
#            certbot:
#                condition: service_healthy
        image: 'n8nio/n8n:${N8N_IMAGE_VERSION}'
        container_name: n8n
        networks:
            - backend
        volumes:
            - 'dtn8n:/home/node/.n8n'
            - './n8n/local-files:/files'
            - 'certbot-etc:${LETSENCRYPT_CONF_PREFIX}'
        hostname: n8n
        restart: unless-stopped
        ports:
            - '5678:5678'
        environment:
            N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
            N8N_HOST: '${N8N_SUBDOMAIN}.${DOMAIN_NAME}'
            N8N_PORT: 5678
            N8N_PROTOCOL: 'https'
            N8N_RUNNERS_ENABLED: true
            NODE_ENV: 'production'
            WEBHOOK_URL: 'https://${N8N_SUBDOMAIN}.${DOMAIN_NAME}/'
            GENERIC_TIMEZONE: '${LOCAL_TIMEZONE}'
            TZ: '${LOCAL_TIMEZONE}'

    certbot:
        depends_on:
            - proxy
        image: certbot/certbot:latest
        container_name: certbot
        networks:
            - backend
        volumes:
            - 'certbot-etc:${LETSENCRYPT_CONF_PREFIX}'
            - 'certbot-var:/var/lib/letsencrypt'
            - '/tmp/acme-challenge:/tmp/acme-challenge'
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "test -d ${LETSENCRYPT_CONF_PREFIX}/live/${DOMAIN_NAME} || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 20
        environment:
            TZ: '${LOCAL_TIMEZONE}'
        entrypoint: /bin/sh -c "${SSL_SNIPPET}; trap exit TERM; while :; do certbot renew --dry-run; sleep 12h & wait $${!}; done;"

    proxy:
        depends_on:
            webui:
                condition: service_healthy
        image: nginx:stable
        container_name: proxy
        networks:
            - backend
            - frontend
        volumes:
            - type: bind
              source: ./proxy/nginx.conf
              target: '${PROXY_PREFIX}/nginx.conf'
            - type: bind
              source: ./proxy/templates/proxy.conf.template
              target: '${PROXY_PREFIX}/templates/default.conf.template'
            - type: bind
              source: ./proxy/ssl-option/options-ssl-nginx.conf
              target: '${LETSENCRYPT_CONF_PREFIX}/options-ssl-nginx.conf'
            - type: bind
              source: ./ssl-proxyconf.sh
              target: '/tmp/ssl-proxyconf.sh'
            - 'certbot-etc:${LETSENCRYPT_CONF_PREFIX}'
            - '/tmp/acme-challenge:/tmp/acme-challenge'
        hostname: proxy
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        environment:
            NGINX_HOST: ${DOMAIN_NAME}
            N8N_SUBDOMAIN: ${N8N_SUBDOMAIN}
            WEBUI_SUBDOMAIN: ${WEBUI_SUBDOMAIN}
            WHATSAPP_SUBDOMAIN: ${WHATSAPP_SUBDOMAIN}
            NGINX_PORT: 80
            TZ: '${LOCAL_TIMEZONE}'
        command: bash -c "/docker-entrypoint.sh nginx -v; sh /tmp/ssl-proxyconf.sh '${DOMAIN_NAME}' '${LETSENCRYPT_CONF_PREFIX}' '${PROXY_PREFIX}'"

    mail:
        image: mailhog/mailhog:latest
        container_name: mail
        networks:
            - backend
        hostname: mail
        restart: unless-stopped
        ports:
            - '1025:1025'
            - '8025:8025'
        environment:
            MH_HOSTNAME: 'mail.${DOMAIN_NAME}'
            MH_AUTH_FILE: '${DOMAIN_NAME}-auth'
        entrypoint: sh -c "echo ${DB_USER}:$(MailHog bcrypt ${DB_PASSWORD}) > ${DOMAIN_NAME}-auth && MailHog"

    pgadmin:
        depends_on:
            certbot:
                condition: service_healthy
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        networks:
            - backend
            - frontend
        volumes:
            - './pgadmin:/var/lib/pgadmin'
            - './certbot/live/${DOMAIN_NAME}/chain.pem:/certs/server.cert'
            - './certbot/live/${DOMAIN_NAME}/privkey.pem:/certs/server.key'
        hostname: pgadmin
        restart: unless-stopped
        ports:
            - '9090:443'
        links:
            - database
            - datavector
        environment:
            PGADMIN_DEFAULT_EMAIL: '${LETSENCRYPT_EMAIL}'
            PGADMIN_DEFAULT_PASSWORD: '${PGA_CONTROLPASS}'
            PGADMIN_ENABLE_TLS: true
            PGADMIN_DISABLE_POSTFIX: true
            PGADMIN_CONFIG_MAIL_SERVER: '"mail"'
            PGADMIN_CONFIG_MAIL_PORT: 1025
            TZ: '${LOCAL_TIMEZONE}'

    database:
        image: ${DATABASE_IMAGE_NAME}:${DATABASE_VERSION}
        container_name: database
        networks:
            - backend
        volumes:
            - 'db:${POSTGRESQL_CONF_PREFIX}'
        hostname: database
        restart: unless-stopped
        ports:
            - '5432:5432'
        shm_size: 128mb
#        healthcheck:
#            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1"]
#            interval: 5s
#            timeout: 5s
#            retries: 10
        environment:
            POSTGRES_DB: '${DB_NAME}'
            POSTGRES_USER: '${DB_USER}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
            PGDATA: '${POSTGRESQL_CONF_PREFIX}'
            LANG: 'en_US.utf8'
            POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US'
            TZ: '${LOCAL_TIMEZONE}'

    datavector:
        image: pgvector/pgvector:pg18-trixie
        container_name: datavector
        networks:
            - backend
        volumes:
            - 'datavector:${POSTGRESQL_CONF_PREFIX}'
            - './datavector/init.sql:/docker-entrypoint-initdb.d/init.sql'
        hostname: datavector
        restart: unless-stopped
        ports:
            - '5433:5432'
        shm_size: 1g
        environment:
            PG_MAJOR: 18
            POSTGRES_DB: '${DB_NAME}'
            POSTGRES_USER: '${DB_USER}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
            PGDATA: '${POSTGRESQL_CONF_PREFIX}'
            LANG: 'en_US.utf8'
            TZ: '${LOCAL_TIMEZONE}'

    ollama:
        image: ollama/ollama:latest
        pull_policy: always
        tty: true
#        runtime: nvidia               
        container_name: ollama
        networks:
            - backend
        volumes:
            - 'ollama:/root/.ollama'
            - './ollama/pull-models.sh:/pull-models.sh'
        hostname: ollama
        restart: unless-stopped
        ports:
            - '11434:11434'
        healthcheck:
            test: ["CMD-SHELL", "ollama", "--version || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 30
        environment:
            OLLAMA_NUM_PARALLEL: 4
            OLLAMA_MAX_LOADED_MODELS: 3
            TZ: '${LOCAL_TIMEZONE}'
#        deploy:
#            resources:
#                reservations:
#                    devices:
#                        - driver: nvidia
#                          count: all
#                          capabilities: [gpu]

    webui:
        depends_on:
            ollama:
                condition: service_healthy
        image: ghcr.io/open-webui/open-webui:main
        container_name: webui
        networks:
            - backend
        volumes:
            - 'webui:/app/backend/data'
        hostname: webui
        restart: unless-stopped
        ports:
            - '8080:8080'
        healthcheck:
            test: ["CMD-SHELL", "curl --silent --fail http://localhost:${PORT:-8080}/health | jq -ne 'input.status == true' || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 100
        extra_hosts:
            - host.docker.internal:host-gateway
        environment:
            OLLAMA_BASE_URL: 'http://ollama:11434'
            WEBUI_URL: 'https://${WEBUI_SUBDOMAIN}.${DOMAIN_NAME}'
            DEFAULT_LOCALE: 'en'
            WEBUI_NAME: 'Damalis Ollama WebUI'
            WEBUI_SECRET_KEY: 't0p-s3cr3t'
            TZ: '${LOCAL_TIMEZONE}'

    redis:
        image: redis:latest
        container_name: redis
        networks:
            - backend
        volumes:
            - 'dtredis:/data'
        #    - type: bind
        #      source: ./redis
        #      target: '${REDIS_CONF_PREFIX}/redis'
        hostname: redis
        sysctls:
            - net.core.somaxconn=512
        restart: unless-stopped
        ports:
            - '6379:6379'
        environment:
            ALLOW_EMPTY_PASSWORD: 'yes'
            TZ: '${LOCAL_TIMEZONE}'
        #command: "redis-server ${REDIS_CONF_PREFIX}/redis/redis.conf"

    whatsapp:
        depends_on:
            certbot:
                condition: service_healthy
        image: devlikeapro/waha:latest
        container_name: whatsapp
        networks:
            - backend
            - frontend
        volumes:
            - './whatsapp/sessions:/app/.sessions'
            - './whatsapp/media:/app/.media'
        hostname: whatsapp
        restart: unless-stopped
        ports:
            - '3000:3000'
        environment:
            WHATSAPP_API_KEY: '${WHATSAPP_API_KEY}'
            WHATSAPP_API_SCHEMA: 'https'
            WHATSAPP_API_HOSTNAME: '${WHATSAPP_SUBDOMAIN}.${DOMAIN_NAME}'
            WHATSAPP_API_PORT: 3000
            WAHA_PUBLIC_URL: 'https://${WHATSAPP_SUBDOMAIN}.${DOMAIN_NAME}'
            WAHA_BASE_URL: 'http://whatsapp:3000'
            WAHA_DASHBOARD_USERNAME: '${WHATSAPP_DASHBOARD_USERNAME}'
            WAHA_DASHBOARD_PASSWORD: '${WHATSAPP_DASHBOARD_PASSWORD}'
            WAHA_DASHBOARD_ENABLED: ${WHATSAPP_DASHBOARD_ENABLED}
            WAHA_LOG_FORMAT: '${WHATSAPP_LOG_FORMAT}'
            WAHA_LOG_LEVEL: '${WHATSAPP_LOG_LEVEL}'
            WHATSAPP_DEFAULT_ENGINE: '${WHATSAPP_DEFAULT_ENGINE}'
            WAHA_PRINT_QR: ${WHATSAPP_PRINT_QR}
            WAHA_MEDIA_STORAGE: '${WHATSAPP_MEDIA_STORAGE}'
            WHATSAPP_FILES_LIFETIME: ${WHATSAPP_FILES_LIFETIME}
            WHATSAPP_DOWNLOAD_MEDIA: ${WHATSAPP_DOWNLOAD_MEDIA}
            WHATSAPP_SWAGGER_CONFIG_ADVANCED: ${WHATSAPP_SWAGGER_CONFIG_ADVANCED}
            WHATSAPP_SWAGGER_USERNAME: '${WHATSAPP_SWAGGER_USERNAME}'
            WHATSAPP_SWAGGER_PASSWORD: '${WHATSAPP_SWAGGER_PASSWORD}'
            TZ: '${LOCAL_TIMEZONE}'

networks:
    backend: null
    frontend: null

volumes:
    dtn8n:
        name: n8n-data
    certbot-etc:
        external: true
    certbot-var:
        name: certbot-var
    db:
        name: db-data
    ollama:
        name: ollama-data
    webui:
        name: webui-data
    datavector:
        name: datavector-data
    dtredis:
        name: redis-data
